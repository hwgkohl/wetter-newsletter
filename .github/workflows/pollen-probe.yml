name: Pollen-Sondierung
"on": {workflow_dispatch: {}}
jobs:
  sondierung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Kandidatenpfade testen
        env: {KACHELMANN_API_KEY: "${{ secrets.KACHELMANN_API_KEY }}"}
        run: python3 pollen_probe.py
